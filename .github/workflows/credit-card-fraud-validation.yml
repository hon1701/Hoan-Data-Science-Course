name: Credit Card Fraud Risk Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Credit-Card-Fraud-Risk-Ranking/**'
      - '.github/workflows/credit-card-fraud-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Credit-Card-Fraud-Risk-Ranking/**'
      - '.github/workflows/credit-card-fraud-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    defaults:
      run:
        working-directory: Credit-Card-Fraud-Risk-Ranking
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 matplotlib==3.10.8
      - name: Run notebooks on verified real data
        run: |
          python -m ipykernel install --user --name python3
          python -X utf8 scripts/run_full_project.py 2>&1 | tee outputs/pipeline.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: credit-card-fraud-risk-results
          retention-days: 30
          if-no-files-found: error
          path: |
            Credit-Card-Fraud-Risk-Ranking/outputs/tables/
            Credit-Card-Fraud-Risk-Ranking/outputs/figures/
            Credit-Card-Fraud-Risk-Ranking/outputs/notebooks/
            Credit-Card-Fraud-Risk-Ranking/outputs/tests.xml
            Credit-Card-Fraud-Risk-Ranking/outputs/pipeline.log
            Credit-Card-Fraud-Risk-Ranking/outputs/run_manifest.json
            Credit-Card-Fraud-Risk-Ranking/outputs/requirements-lock.txt
